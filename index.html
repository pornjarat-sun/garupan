<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารจัดการข้อมูลครุภัณฑ์ - คณะการจัดการสิ่งแวดล้อม</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-md">
        <div class="container mx-auto px-4 py-6">
            <h1 class="text-2xl font-bold">ระบบบริหารจัดการข้อมูลครุภัณฑ์</h1>
            <p class="text-blue-100 text-sm mt-1">คณะการจัดการสิ่งแวดล้อม</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        
        <!-- Filter and Search Section -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Search Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ค้นหา (ชื่อ / รหัสครุภัณฑ์)</label>
                    <input type="text" id="searchInput" oninput="filterData()" placeholder="พิมพ์ชื่อหรือรหัสครุภัณฑ์..." class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <!-- Status Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">สถานะการใช้งานปัจจุบัน</label>
                    <select id="statusFilter" onchange="filterData()" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        <option value="">-- ทั้งหมด --</option>
                        <option value="ใช้การได้">ใช้การได้</option>
                        <option value="ชำรุด">ชำรุด</option>
                        <option value="เสื่อมสภาพ">เสื่อมสภาพ</option>
                        <option value="ไม่ใช้งาน">ไม่ใช้งาน</option>
                        <option value="ตัดจำหน่าย">ตัดจำหน่าย</option>
                        <option value="โอนให้">โอนให้</option>
                        <option value="สูญหาย">สูญหาย</option>
                    </select>
                </div>
                <!-- Location Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">สถานที่ใช้งานปัจจุบัน</label>
                    <select id="locationFilter" onchange="filterData()" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        <option value="">-- สถานที่ทั้งหมด --</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Status Summary Badges -->
        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3 mb-6" id="summaryCards">
            <!-- Dynamic Content generated by JS -->
        </div>

        <!-- Table Display -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h2 class="font-semibold text-gray-700">รายการครุภัณฑ์ (<span id="totalItems">0</span> รายการ)</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-100 text-gray-700 uppercase text-xs border-b">
                        <tr>
                            <th class="px-6 py-3">ลำดับ</th>
                            <th class="px-6 py-3">รหัสครุภัณฑ์</th>
                            <th class="px-6 py-3">ชื่อครุภัณฑ์</th>
                            <th class="px-6 py-3">สถานที่ใช้งานปัจจุบัน</th>
                            <th class="px-6 py-3 text-center">สถานะการใช้งาน</th>
                            <th class="px-6 py-3 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable" class="divide-y divide-gray-200">
                        <!-- Data Rows Generated Here -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // ตัวอย่างข้อมูลตั้งต้น (จำลองโครงสร้างจากไฟล์ Excel คณะการจัดการสิ่งแวดล้อม)
        let equipmentData = [
            { id: 1, code: "ENV-65-001", name: "เครื่องวัดคุณภาพอากาศแบบพกพา", location: "ห้องปฏิบัติการ ENV 201", status: "ใช้การได้" },
            { id: 2, code: "ENV-65-002", name: "คอมพิวเตอร์ประมวลผลสูง", location: "ห้องสำนักงานชั้น 3", status: "ใช้การได้" },
            { id: 3, code: "ENV-64-015", name: "เครื่องปั่นเหวี่ยงสาร (Centrifuge)", location: "ห้องวิเคราะห์เคมี", status: "ชำรุด" },
            { id: 4, code: "ENV-63-088", name: "ตู้ดูดควันสารเคมี", location: "ห้องปฏิบัติการ ENV 102", status: "เสื่อมสภาพ" },
            { id: 5, code: "ENV-62-004", name: "โปรเจคเตอร์", location: "ห้องบรรยายรวม ENV 301", status: "ไม่ใช้งาน" },
            { id: 6, code: "ENV-61-009", name: "เครื่องพิมพ์เลเซอร์", location: "ห้องธุรการ", status: "ตัดจำหน่าย" },
            { id: 7, code: "ENV-60-003", name: "กล้องจุลทรรศน์ชนิดถ่ายภาพได้", location: "ศูนย์วิจัยสิ่งแวดล้อม", status: "โอนให้" },
            { id: 8, code: "ENV-65-099", name: "เครื่อง GPS แบบสำรวจ", location: "ห้องเก็บเครื่องมือภาคสนาม", status: "สูญหาย" }
        ];

        const statuses = ["ใช้การได้", "ชำรุด", "เสื่อมสภาพ", "ไม่ใช้งาน", "ตัดจำหน่าย", "โอนให้", "สูญหาย"];

        function initApp() {
            populateLocations();
            renderTable(equipmentData);
            renderSummary();
        }

        // ดึงรายการสถานที่ที่มีทั้งหมดใส่ Dropdown Filter
        function populateLocations() {
            const locations = [...new Set(equipmentData.map(item => item.location))];
            const select = document.getElementById('locationFilter');
            locations.forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc;
                opt.textContent = loc;
                select.appendChild(opt);
            });
        }

        // กำหนดสีของ Badge สถานะ
        function getStatusBadge(status) {
            const colorMap = {
                "ใช้การได้": "bg-green-100 text-green-800 border-green-200",
                "ชำรุด": "bg-red-100 text-red-800 border-red-200",
                "เสื่อมสภาพ": "bg-yellow-100 text-yellow-800 border-yellow-200",
                "ไม่ใช้งาน": "bg-gray-100 text-gray-800 border-gray-200",
                "ตัดจำหน่าย": "bg-purple-100 text-purple-800 border-purple-200",
                "โอนให้": "bg-blue-100 text-blue-800 border-blue-200",
                "สูญหาย": "bg-orange-100 text-orange-800 border-orange-200"
            };
            return `<span class="px-2.5 py-1 text-xs font-semibold rounded-full border ${colorMap[status] || 'bg-gray-100'}">${status}</span>`;
        }

        // แสดงผลตาราง
        function renderTable(data) {
            const tbody = document.getElementById('dataTable');
            document.getElementById('totalItems').innerText = data.length;
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-gray-400">ไม่พบข้อมูลที่ตรงตามเงื่อนไข</td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-gray-500">${index + 1}</td>
                    <td class="px-6 py-4 font-mono font-medium text-blue-600">${item.code}</td>
                    <td class="px-6 py-4 font-medium text-gray-900">${item.name}</td>
                    <td class="px-6 py-4 text-gray-600">${item.location}</td>
                    <td class="px-6 py-4 text-center">${getStatusBadge(item.status)}</td>
                    <td class="px-6 py-4 text-center">
                        <select onchange="updateStatus(${item.id}, this.value)" class="text-xs p-1.5 border border-gray-300 rounded-md focus:ring-blue-500">
                            ${statuses.map(st => `<option value="${st}" ${st === item.status ? 'selected' : ''}>${st}</option>`).join('')}
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // อัปเดตสถานะการใช้งาน
        function updateStatus(id, newStatus) {
            const item = equipmentData.find(d => d.id === id);
            if (item) {
                item.status = newStatus;
                filterData();
                renderSummary();
            }
        }

        // ระบบกรองและค้นหา
        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const selectedStatus = document.getElementById('statusFilter').value;
            const selectedLocation = document.getElementById('locationFilter').value;

            const filtered = equipmentData.filter(item => {
                const matchSearch = item.name.toLowerCase().includes(search) || item.code.toLowerCase().includes(search);
                const matchStatus = selectedStatus === "" || item.status === selectedStatus;
                const matchLocation = selectedLocation === "" || item.location === selectedLocation;
                return matchSearch && matchStatus && matchLocation;
            });

            renderTable(filtered);
        }

        // แสดง Card สรุปสถานะทั้งหมด
        function renderSummary() {
            const container = document.getElementById('summaryCards');
            container.innerHTML = '';

            statuses.forEach(st => {
                const count = equipmentData.filter(d => d.status === st).length;
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-lg border border-gray-200 text-center shadow-xs";
                card.innerHTML = `
                    <div class="text-xs text-gray-500 mb-1">${st}</div>
                    <div class="text-lg font-bold text-gray-800">${count}</div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
