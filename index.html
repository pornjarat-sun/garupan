<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบริหารจัดการและค้นหาข้อมูลครุภัณฑ์ - คณะการจัดการสิ่งแวดล้อม </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-blue-700 text-white shadow-md">
    <div class="container mx-auto px-4 py-6">
      <h1 class="text-2xl md:text-3xl font-bold">📦 ระบบบริหารจัดการและค้นหาข้อมูลครุภัณฑ์</h1>
      <p class="text-blue-100 text-sm mt-1">คณะการจัดการสิ่งแวดล้อม</p>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    
    <!-- Filter and Search Section -->
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6">
      <form id="searchForm" onsubmit="event.preventDefault(); handleSearch();" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">ค้นหา (ชื่อ / ยี่ห้อ / รหัส / สถานที่)</label>
          <input type="text" id="searchInput" placeholder="พิมพ์ชื่อ, ยี่ห้อ หรือรหัสครุภัณฑ์..." class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 text-sm">
        </div>
        
        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">สถานะการใช้งาน</label>
          <select id="statusFilter" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 text-sm">
            <option value="">-- สถานะทั้งหมด --</option>
            <option value="ใช้การได้">ใช้การได้</option>
            <option value="ชำรุด">ชำรุด</option>
            <option value="เสื่อมสภาพ">เสื่อมสภาพ</option>
            <option value="ไม่ใช้งาน">ไม่ใช้งาน</option>
            <option value="ตัดจำหน่าย">ตัดจำหน่าย</option>
            <option value="โอนให้">โอนให้</option>
            <option value="สูญหาย">สูญหาย</option>
          </select>
        </div>

        <div class="md:col-span-1 flex items-end">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition text-sm">
            ค้นหา
          </button>
        </div>
      </form>
    </div>

    <!-- Results Section -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
        <h2 class="font-semibold text-gray-700 text-base">
          รายการครุภัณฑ์ (<span id="totalItems" class="text-blue-600 font-bold">0</span> รายการ)
        </h2>
      </div>

      <div id="loading" class="hidden text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
        <p class="text-gray-500 mt-2 text-sm">กำลังดึงข้อมูล...</p>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-600">
          <thead class="bg-gray-800 text-white uppercase text-xs">
            <tr>
              <th class="px-4 py-3">ประเภท</th>
              <th class="px-4 py-3">รหัสครุภัณฑ์</th>
              <th class="px-4 py-3">ชื่อครุภัณฑ์</th>
              <th class="px-4 py-3">ยี่ห้อ</th>
              <th class="px-4 py-3">สถานที่ใช้งาน</th>
              <th class="px-4 py-3 text-center">สถานะ</th>
              <th class="px-4 py-3">หมายเหตุ</th>
              <th class="px-4 py-3 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="dataTable" class="divide-y divide-gray-200">
            <tr>
              <td colspan="8" class="text-center py-8 text-gray-500">กรุณากดปุ่มค้นหาเพื่อแสดงข้อมูล</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Edit Modal (หน้าต่างป๊อปอัปสำหรับแก้ไข) -->
  <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-6">
      <h3 class="text-lg font-bold text-gray-800 mb-4">✏️ อัปเดตข้อมูลครุภัณฑ์</h3>
      <form id="editForm" onsubmit="event.preventDefault(); submitUpdate();">
        <input type="hidden" id="editSheetName">
        <input type="hidden" id="editRowIndex">

        <div class="mb-3">
          <label class="block text-xs font-semibold text-gray-500 uppercase">รหัสครุภัณฑ์</label>
          <p id="editCode" class="text-sm font-bold text-gray-800">-</p>
        </div>

        <div class="mb-3">
          <label class="block text-xs font-semibold text-gray-500 uppercase">ชื่อครุภัณฑ์</label>
          <p id="editName" class="text-sm text-gray-700">-</p>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">สถานที่ใช้งานปัจจุบัน</label>
          <input type="text" id="editRoom" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">สถานะการใช้งาน</label>
          <select id="editStatus" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500">
            <option value="ใช้การได้">ใช้การได้</option>
            <option value="ชำรุด">ชำรุด</option>
            <option value="เสื่อมสภาพ">เสื่อมสภาพ</option>
            <option value="ไม่ใช้งาน">ไม่ใช้งาน</option>
            <option value="ตัดจำหน่าย">ตัดจำหน่าย</option>
            <option value="โอนให้">โอนให้</option>
            <option value="สูญหาย">สูญหาย</option>
          </select>
        </div>

        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-1">หมายเหตุเพิ่มเติม</label>
          <input type="text" id="editRemark" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500">
        </div>

        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-md text-sm font-medium">
            ยกเลิก
          </button>
          <button type="submit" id="saveBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm font-medium">
            บันทึกข้อมูล
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentData = [];

    window.onload = function() {
      handleSearch();
    };

    function handleSearch() {
      const keyword = document.getElementById('searchInput').value;
      const statusFilter = document.getElementById('statusFilter').value;

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('dataTable').innerHTML = '';
      document.getElementById('totalItems').innerText = '0';

      google.script.run
        .withSuccessHandler(renderTable)
        .withFailureHandler(handleError)
        .searchEquipment(keyword, statusFilter);
    }

    function renderTable(data) {
      currentData = data || [];
      document.getElementById('loading').classList.add('hidden');
      const tbody = document.getElementById('dataTable');
      tbody.innerHTML = '';

      document.getElementById('totalItems').innerText = currentData.length;

      if (currentData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-gray-500">ไม่พบข้อมูลครุภัณฑ์ที่ตรงกับเงื่อนไข</td></tr>`;
        return;
      }

      currentData.forEach((item, index) => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-gray-50 transition duration-150';

        let statusBadgeClass = 'bg-gray-100 text-gray-800';
        if (item.status === 'ใช้การได้') statusBadgeClass = 'bg-green-100 text-green-800';
        else if (item.status === 'ชำรุด') statusBadgeClass = 'bg-red-100 text-red-800';
        else if (item.status === 'เสื่อมสภาพ') statusBadgeClass = 'bg-orange-100 text-orange-800';
        else if (item.status === 'ไม่ใช้งาน') statusBadgeClass = 'bg-yellow-100 text-yellow-800';
        else if (item.status === 'ตัดจำหน่าย') statusBadgeClass = 'bg-purple-100 text-purple-800';

        row.innerHTML = `
          <td class="px-4 py-3 font-medium text-gray-500">${item.sheetType || '-'}</td>
          <td class="px-4 py-3 font-semibold text-gray-900">${item.code || '-'}</td>
          <td class="px-4 py-3">${item.name || '-'}</td>
          <td class="px-4 py-3 text-gray-700 font-medium">${item.brand || '-'}</td>
          <td class="px-4 py-3">${item.room || '-'}</td>
          <td class="px-4 py-3 text-center">
            <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${statusBadgeClass}">
              ${item.status}
            </span>
          </td>
          <td class="px-4 py-3 text-gray-500">${item.remark || '-'}</td>
          <td class="px-4 py-3 text-center">
            <button onclick="openEditModal(${index})" class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white text-xs rounded shadow-sm">
              แก้ไข
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function openEditModal(index) {
      const item = currentData[index];
      if (!item) return;

      document.getElementById('editSheetName').value = item.sheetType;
      document.getElementById('editRowIndex').value = item.rowIndex;
      document.getElementById('editCode').innerText = item.code;
      document.getElementById('editName').innerText = item.name + (item.brand !== '-' ? ` (${item.brand})` : '');
      document.getElementById('editRoom').value = item.room !== '-' ? item.room : '';
      document.getElementById('editStatus').value = item.status;
      document.getElementById('editRemark').value = item.remark !== '-' ? item.remark : '';

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function submitUpdate() {
      const sheetName = document.getElementById('editSheetName').value;
      const rowIndex = parseInt(document.getElementById('editRowIndex').value);
      const newRoom = document.getElementById('editRoom').value;
      const newStatus = document.getElementById('editStatus').value;
      const newRemark = document.getElementById('editRemark').value;

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.innerText = 'กำลังบันทึก...';
      saveBtn.disabled = true;

      google.script.run
        .withSuccessHandler(res => {
          saveBtn.innerText = 'บันทึกข้อมูล';
          saveBtn.disabled = false;
          if (res.success) {
            alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
            closeModal();
            handleSearch(); // ค้นหาใหม่เพื่ออัปเดตหน้าจอ
          } else {
            alert(res.message);
          }
        })
        .withFailureHandler(err => {
          saveBtn.innerText = 'บันทึกข้อมูล';
          saveBtn.disabled = false;
          alert('เกิดข้อผิดพลาด: ' + err.message);
        })
        .updateEquipment(sheetName, rowIndex, newRoom, newStatus, newRemark);
    }

    function handleError(error) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('dataTable').innerHTML = `
        <tr><td colspan="8" class="text-center py-8 text-red-500">เกิดข้อผิดพลาดในการดึงข้อมูล: ${error.message}</td></tr>`;
    }
  </script>
</body>
</html>
